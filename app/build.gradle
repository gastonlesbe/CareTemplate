plugins {
    id("com.android.application")
    id("com.google.gms.google-services")
}

android {
    namespace 'com.gastonlesbegueris.caretemplate'

    // Que compile y apunte a la misma API (evita warnings raros)
    compileSdk 36

    defaultConfig {
        applicationId "com.gastonlesbegueris.caretemplate"
        minSdk 24
        targetSdk 36
        versionCode 17
        versionName "2.6"
        vectorDrawables.useSupportLibrary = true
        
        // Configurar el test runner para instrumentación
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Java 17 para evitar el warning de "source value 8 is obsolete"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Flavors: uno solo, sin bloques anidados
    flavorDimensions "vertical"
    productFlavors {
        pets {
            dimension "vertical"
            applicationIdSuffix ".pets"
            resValue "string", "app_name", "CarePal: Pets"
            resValue "string", "app_type", "pets"     // 👈 para reemplazar BuildConfig.FLAVOR
            resValue "string", "admob_app_id", "ca-app-pub-9841764898906750~2089158049"
            resValue "string", "admob_interstitial_id", "ca-app-pub-9841764898906750/2894416051"
        }
        cars {
            dimension "vertical"
            applicationIdSuffix ".cars"
            resValue "string", "app_name", "CarePal: Cars"
            resValue "string", "app_type", "cars"
            resValue "string", "admob_app_id", "ca-app-pub-9841764898906750~6384453597"
            resValue "string", "admob_interstitial_id", "ca-app-pub-9841764898906750/2828527941"
        }
        family {
            dimension "vertical"
            applicationIdSuffix ".family"
            resValue "string", "app_name", "CarePal Family"
            resValue "string", "app_type", "family"
            resValue "string", "admob_app_id", "ca-app-pub-9841764898906750~9388593714"
            resValue "string", "admob_interstitial_id", "ca-app-pub-9841764898906750/6799440463"
        }
        house {
            dimension "vertical"
            applicationIdSuffix ".house"
            resValue "string", "app_name", "CarePal: Houses"
            resValue "string", "app_type", "house"
            resValue "string", "admob_app_id", "ca-app-pub-9841764898906750~1868469990"
            resValue "string", "admob_interstitial_id", "ca-app-pub-9841764898906750/9178313877"
        }
        griscal {
            dimension "vertical"
            applicationId "app.griscal"
            versionCode 1
            versionName "1.0"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Configuración de firma para release
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Generar símbolos nativos para depuración
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            signingConfig signingConfigs.debug
            // Debug = Google's official sample ad units + Appodeal test mode, for EVERY
            // flavor, so dev/emulator runs (incl. automated marketing screenshots) never
            // serve or count live ads. buildType resValues override the flavor resValues
            // above; the flavors' values-en strings are overridden in src/debug/res/values-en.
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/6300978111"
            resValue "string", "admob_rewarded_id", "ca-app-pub-3940256099942544/5224354917"
            resValue "bool", "appodeal_testing", "true"
        }
    }
    
    // Disable baseline profile to avoid INSTALL_BASELINE_PROFILE_FAILED errors
    // This prevents issues when installing on some devices
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        // Exclude baseline profile files that can cause installation issues
        resources {
            excludes += ['**/baseline.prof', '**/*.prof']
        }
    }

    // No hace falta fijar buildToolsVersion manualmente; lo elige AGP
    // buildToolsVersion '36.1.0'
}

dependencies {
    implementation libs.appcompat.v171
    implementation libs.constraintlayout.v221
    implementation libs.recyclerview
    implementation libs.cardview


    // Material: usa UNA sola versión
    implementation libs.google.material

    // Firebase (BoM + módulos)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.analytics

    // Room (Java)
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // Ads - Appodeal SDK (replaces AdMob)
    implementation libs.sdk
    
    // AdMob SDK for interstitial ads
    implementation libs.play.services.ads
   // implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Google Play In-App Review
    implementation libs.review

    // Google Sign-In (needed for griscal flavor)
    implementation libs.play.services.auth

    // Unit test dependencies (run on JVM - app/src/test)
    testImplementation libs.junit

    // Instrumentation test dependencies (run on device - app/src/androidTest)
    androidTestImplementation libs.junit.v121
    androidTestImplementation libs.runner
    androidTestImplementation libs.rules
    androidTestImplementation libs.espresso.core.v361

}
